name: Docker Build & Test

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t upi-api .

      - name: Start container
        run: docker run -d -p 8000:8000 --name upi-api-test upi-api

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8000/; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 3
          done
          echo "API did not start in time"
          docker logs upi-api-test
          exit 1

      - name: Stop container
        if: always()
        run: docker stop upi-api-test && docker rm upi-api-test
